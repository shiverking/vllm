<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realtime ASR Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-labelledby="page-title">
        <header class="header">
          <div>
            <p class="eyebrow">vLLM Realtime</p>
            <h1 id="page-title">&#23454;&#26102;&#35821;&#38899;&#36716;&#20889;</h1>
          </div>
          <div class="status" id="status" role="status">
            &#26410;&#36830;&#25509;
          </div>
        </header>

        <div class="settings">
          <label class="field">
            <span>&#27169;&#22411;&#26381;&#21153;&#22320;&#22336;</span>
            <input
              id="server-url"
              type="url"
              value="ws://135.30.72.115:1025/v1/realtime"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <label class="field">
            <span>&#27169;&#22411;</span>
            <input
              id="model"
              type="text"
              value="Qwen3-ASR-1.7B"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
        </div>

        <div class="actions">
          <button id="start-btn" class="primary" type="button">
            &#24320;&#22987;
          </button>
          <button id="stop-btn" type="button" disabled>
            &#32467;&#26463;
          </button>
        </div>

        <label class="transcript-label" for="transcript">
          &#36716;&#20889;&#32467;&#26524;
        </label>
        <textarea
          id="transcript"
          placeholder="&#28857;&#20987;&#24320;&#22987;&#21518;&#65292;&#35828;&#35805;&#20869;&#23481;&#20250;&#23454;&#26102;&#26174;&#31034;&#22312;&#36825;&#37324;&#12290;"
          readonly
        ></textarea>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
